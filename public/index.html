<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>わが家のキャッシュフロー表</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark">家計</span>
    <h1>わが家のキャッシュフロー表</h1>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab-btn is-active" data-tab="cashflow" role="tab" aria-selected="true">キャッシュフロー表</button>
    <button class="tab-btn" data-tab="events" role="tab" aria-selected="false">ライフイベント表</button>
    <button class="tab-btn" data-tab="family" role="tab" aria-selected="false">家族設定</button>
    <button class="tab-btn" data-tab="items" role="tab" aria-selected="false">項目設定</button>
  </nav>
</header>

<main>

  <!-- ===================== キャッシュフロー表 ===================== -->
  <section id="tab-cashflow" class="tab-panel is-active">
    <div class="panel-toolbar">
      <div class="settings-group">
        <label>開始年
          <input type="number" id="cf-startYear" class="mini-input" />
        </label>
        <label>表示年数
          <input type="number" id="cf-years" class="mini-input" min="1" max="80" />
        </label>
        <label>現在の貯蓄額
          <input type="number" id="cf-startingBalance" class="mini-input wide" />
        </label>
        <button id="cf-save-settings" class="btn btn-ghost">設定を保存</button>
      </div>
      <div class="view-toggle" id="cf-view-toggle">
        <button type="button" class="is-active" data-view="year">年表示</button>
        <button type="button" data-view="month">月表示</button>
      </div>
      <p class="hint">数値セルはクリックして直接入力できます（年表示のみ編集可）。月表示では年間の金額を12等分した目安を毎月表示し、ライフイベント費用は実際に発生する月にまとめて計上します。</p>
    </div>
    <div class="fp-insight" id="cashflow-insight"></div>
    <div class="table-scroll" id="cashflow-scroll">
      <table class="cf-table" id="cashflow-table" aria-label="家庭のキャッシュフロー表"></table>
    </div>
  </section>

  <!-- ===================== ライフイベント表 ===================== -->
  <section id="tab-events" class="tab-panel">
    <div class="panel-toolbar">
      <h2>ライフイベント</h2>
      <div class="toolbar-right">
        <div class="view-toggle" id="event-view-toggle">
          <button type="button" class="is-active" data-view="year">年表示</button>
          <button type="button" data-view="month">月表示</button>
        </div>
        <button class="btn btn-primary" id="event-add-btn">+ イベントを追加</button>
      </div>
    </div>

    <div class="fp-insight" id="events-insight"></div>

    <!-- 表示期間・表示する家族の絞り込み -->
    <div class="timeline-filters" id="timeline-filters">
      <div class="filter-block">
        <span class="filter-label">表示期間</span>
        <input type="number" id="tl-range-start" class="mini-input" />
        <span class="filter-sep">〜</span>
        <input type="number" id="tl-range-end" class="mini-input" />
        <span class="filter-unit">年</span>
      </div>
      <div class="filter-block filter-block-family">
        <span class="filter-label">表示する家族</span>
        <div class="family-chip-list" id="family-chip-list"></div>
      </div>
    </div>

    <div class="timeline-scroll" id="events-timeline-scroll">
      <!-- ライフイベントのタイムライン（家族ごとの行）はJSで描画されます -->
    </div>
    <div class="timeline-legend" id="events-legend"></div>

    <h3 class="subheading">一覧</h3>
    <div class="table-scroll">
      <table class="simple-table" id="events-table">
        <thead>
          <tr>
            <th>時期</th>
            <th>対象</th>
            <th>カテゴリ</th>
            <th>イベント内容</th>
            <th class="num">費用（円）</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="events-tbody"></tbody>
      </table>
    </div>
  </section>

  <!-- ===================== 家族設定 ===================== -->
  <section id="tab-family" class="tab-panel">
    <div class="panel-toolbar">
      <h2>家族メンバー</h2>
      <button class="btn btn-primary" id="family-add-btn">+ 家族を追加</button>
    </div>
    <div class="table-scroll">
      <table class="simple-table" id="family-table">
        <thead>
          <tr>
            <th>氏名</th>
            <th>続柄</th>
            <th class="num">生年</th>
            <th>ラベルカラー</th>
            <th class="col-actions"></th>
          </tr>
        </thead>
        <tbody id="family-tbody"></tbody>
      </table>
    </div>
  </section>

  <!-- ===================== 項目設定 ===================== -->
  <section id="tab-items" class="tab-panel">
    <div class="panel-toolbar">
      <h2>収支項目</h2>
      <button class="btn btn-primary" id="item-add-btn">+ 項目を追加</button>
    </div>
    <div class="items-columns">
      <div class="items-col">
        <h3 class="items-col-title income">収入項目</h3>
        <table class="simple-table" id="income-items-table">
          <tbody id="income-items-tbody"></tbody>
        </table>
      </div>
      <div class="items-col">
        <h3 class="items-col-title expense">支出項目</h3>
        <table class="simple-table" id="expense-items-table">
          <tbody id="expense-items-tbody"></tbody>
        </table>
      </div>
    </div>
  </section>

</main>

<!-- ===================== 汎用モーダル ===================== -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modal-title">追加</h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel">キャンセル</button>
      <button class="btn btn-primary" id="modal-confirm">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
